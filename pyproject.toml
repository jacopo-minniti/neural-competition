[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neural-competition"
version = "0.1.0"
description = "Small teacher-student experiments on width and update interference"
requires-python = ">=3.11"
dependencies = ["torch>=2.6", "numpy>=1.26"]

[project.optional-dependencies]
analysis = ["matplotlib>=3.8", "pandas>=2.2"]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/neural_competition"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
